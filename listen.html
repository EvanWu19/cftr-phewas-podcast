<header class="site"><div class="wrap"><h1><a href="index.html">CFTR PheWAS Reading Podcast</a></h1>
<div class="sub"><a href="index.html" style="color:var(--accent);text-decoration:none">&#8592; Episodes</a> · Interactive player &#8212; play and ask</div></div></header>
<main class="wrap listen">
  <section class="np">
    <div class="np-row"><select id="np-select" aria-label="Choose episode"></select></div>
    <div class="np-title" id="np-title"></div>
    <audio id="player" controls preload="none" style="width:100%"></audio>
    <div class="np-controls">
      <button id="np-prev" class="btn">&#9198; Prev</button>
      <button id="np-next" class="btn">Next &#9197;</button>
      <span id="np-counter" class="label"></span>
    </div>
  </section>
  <section id="convo" class="convo">
    <div class="convo-row">
      <button id="convo-btn" type="button" class="convo-btn">&#127908; Ask about this episode</button>
      <span id="convo-status" class="convo-status"></span>
    </div>
    <div id="convo-log" class="convo-log"></div>
    <audio id="convo-answer" class="convo-answer"></audio>
    <p class="convo-hint">Ask about whatever&#39;s playing &#8212; the answer knows this episode. Your questions also shape future episodes.</p>
  </section>
</main>
<footer>Generated 2026-07-10 07:11</footer>
<script>
(function(){
  var EPS = window.EPISODES || [];
  var audio = document.getElementById('player');
  var titleEl = document.getElementById('np-title');
  var sel = document.getElementById('np-select');
  var counter = document.getElementById('np-counter');
  if (!EPS.length){ titleEl.textContent = 'No episodes with audio yet.'; return; }
  var qp = new URLSearchParams(location.search);

  var idx = 0;
  var qEp = qp.get('ep');
  if (qEp){ var f = EPS.findIndex(function(e){ return e.slug === qEp; }); if (f >= 0) idx = f; }
  else { try { var s0 = parseInt(localStorage.getItem('listenIdx'), 10); if (s0 >= 0 && s0 < EPS.length) idx = s0; } catch(e){} }

  EPS.forEach(function(e, i){
    var o = document.createElement('option');
    o.value = i; o.textContent = 'Ep ' + e.num + ' · ' + e.title;
    sel.appendChild(o);
  });
  function load(i, autoplay){
    idx = Math.max(0, Math.min(EPS.length - 1, i));
    var e = EPS[idx];
    audio.src = (window.AUDIO_BASE || '') + e.mp3;
    titleEl.textContent = 'Episode ' + e.num + ' · ' + e.title;
    sel.value = idx;
    counter.textContent = (idx + 1) + ' / ' + EPS.length;
    try { localStorage.setItem('listenIdx', idx); } catch(e2){}
    if (autoplay) audio.play().catch(function(){});
  }
  document.getElementById('np-prev').addEventListener('click', function(){ load(idx - 1, true); });
  document.getElementById('np-next').addEventListener('click', function(){ load(idx + 1, true); });
  sel.addEventListener('change', function(){ load(parseInt(sel.value, 10), true); });
  audio.addEventListener('ended', function(){ if (idx + 1 < EPS.length) load(idx + 1, true); });
  load(idx, false);

  // ---- conversation, always about the currently playing episode ----
  var box = document.getElementById('convo');
  var btn = document.getElementById('convo-btn');
  var statusEl = document.getElementById('convo-status');
  var logEl = document.getElementById('convo-log');
  var answer = document.getElementById('convo-answer');
  var recorder = null, chunks = [], recording = false, apiPromise = null;

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function setStatus(t){ statusEl.textContent = t || ''; }
  function addTurn(role, text){
    var p = document.createElement('p');
    p.className = 'convo-turn convo-' + role;
    p.innerHTML = '<span class="convo-role">' + (role === 'you' ? 'You' : 'Host') + '</span> '
      + esc(text).replace(/\n/g, '<br>');
    logEl.appendChild(p);
    logEl.style.display = 'block';
    logEl.scrollTop = logEl.scrollHeight;
  }
  function getApi(){
    if (apiPromise) return apiPromise;
    try {
      var q = qp.get('api');
      if (q){ localStorage.setItem('convoApi', q.replace(/\/+$/, '')); }
      var stored = localStorage.getItem('convoApi');
      if (stored){ apiPromise = Promise.resolve(stored); return apiPromise; }
    } catch(e){}
    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, 6000);
    apiPromise = fetch((window.AUDIO_BASE || '') + 'convo_api.json', {cache:'no-store', signal: ctrl.signal})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ clearTimeout(to); return (j && j.api) ? j.api.replace(/\/+$/, '') : null; })
      .catch(function(){ clearTimeout(to); return null; });
    return apiPromise;
  }
  async function start(){
    setStatus('Connecting…');
    var api = await getApi();
    if (!api){ setStatus('Voice Q&A is offline right now. Add ?api=<your tunnel URL> to the page URL.'); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder){ setStatus('Mic not supported in this browser.'); return; }
    var stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ setStatus('Microphone permission denied.'); return; }
    if (!audio.paused){ audio.pause(); box.dataset.resume = '1'; }
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      send(api, new Blob(chunks, {type: (recorder && recorder.mimeType) || 'audio/webm'}));
    };
    recorder.start();
    recording = true;
    btn.textContent = '⏹ Stop & send';
    btn.classList.add('convo-rec');
    setStatus('Listening about “' + EPS[idx].title + '”… tap stop when done.');
  }
  function stop(){
    recording = false;
    btn.textContent = '🎤 Ask about this episode';
    btn.classList.remove('convo-rec');
    setStatus('Thinking…');
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  }
  async function send(api, blob){
    var fd = new FormData();
    fd.append('slug', EPS[idx].slug);
    fd.append('t', String(Math.floor(audio.currentTime || 0)));
    fd.append('audio', blob, 'q.webm');
    try {
      var r = await fetch(api + '/ask', {method:'POST', body: fd});
      var j = await r.json();
      if (!r.ok || j.error){ setStatus('Error: ' + (j.error || r.status)); return; }
      addTurn('you', j.question);
      addTurn('host', j.answer);
      setStatus('');
      if (j.audio_b64){
        answer.src = 'data:' + (j.audio_mime || 'audio/mpeg') + ';base64,' + j.audio_b64;
        answer.onended = function(){ if (box.dataset.resume === '1'){ audio.play().catch(function(){}); box.dataset.resume = ''; } };
        answer.play();
      }
    } catch(e){ setStatus('Network error — is the backend running?'); }
  }
  btn.addEventListener('click', function(){ recording ? stop() : start(); });
})();
</script>
