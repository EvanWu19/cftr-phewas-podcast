<footer>Generated 2026-07-30 07:09</footer>
<script>
(function(){
  var EPS = window.EPISODES || [];
  var audio = document.getElementById('player');
  var titleEl = document.getElementById('np-title');
  var sel = document.getElementById('np-select');
  var counter = document.getElementById('np-counter');
  if (!EPS.length){ titleEl.textContent = 'No episodes with audio yet.'; return; }
  var qp = new URLSearchParams(location.search);

  var idx = 0;
  var qEp = qp.get('ep');
  if (qEp){ var f = EPS.findIndex(function(e){ return e.slug === qEp; }); if (f >= 0) idx = f; }
  else { try { var s0 = parseInt(localStorage.getItem('listenIdx'), 10); if (s0 >= 0 && s0 < EPS.length) idx = s0; } catch(e){} }

  EPS.forEach(function(e, i){
    var o = document.createElement('option');
    o.value = i; o.textContent = 'Ep ' + e.num + ' · ' + e.title;
    sel.appendChild(o);
  });
  function load(i, autoplay){
    idx = Math.max(0, Math.min(EPS.length - 1, i));
    var e = EPS[idx];
    audio.src = (window.AUDIO_BASE || '') + e.mp3;
    titleEl.textContent = 'Episode ' + e.num + ' · ' + e.title;
    sel.value = idx;
    counter.textContent = (idx + 1) + ' / ' + EPS.length;
    try { localStorage.setItem('listenIdx', idx); } catch(e2){}
    updateMediaSession();
    if (autoplay) audio.play().catch(function(){});
  }
  function updateMediaSession(){
    if (!('mediaSession' in navigator)) return;
    var e = EPS[idx];
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Episode ' + e.num + ' · ' + e.title,
        artist: 'CFTR PheWAS Reading Podcast',
        album: 'Double-tap = Ask · Triple-tap = Previous'
      });
    } catch(e3){}
  }
  document.getElementById('np-prev').addEventListener('click', function(){ load(idx - 1, true); });
  document.getElementById('np-next').addEventListener('click', function(){ load(idx + 1, true); });
  sel.addEventListener('change', function(){ load(parseInt(sel.value, 10), true); });
  audio.addEventListener('ended', function(){ if (idx + 1 < EPS.length) load(idx + 1, true); });
  load(idx, false);

  // ---- conversation, always about the currently playing episode ----
  var box = document.getElementById('convo');
  var btn = document.getElementById('convo-btn');
  var statusEl = document.getElementById('convo-status');
  var logEl = document.getElementById('convo-log');
  var answer = document.getElementById('convo-answer');
  var textInput = document.getElementById('convo-text');
  var sendBtn = document.getElementById('convo-send');
  var recorder = null, chunks = [], recording = false, apiPromise = null;
  var _audioCtx = null, _vadTimer = null, _maxTimer = null;

  // Auto-stop: send as soon as the listener stops talking. Needed because a
  // second earbud double-tap can't reach the page while recording (the episode
  // audio is paused, so the media session is inactive and media keys aren't
  // routed here). Uses the Web Audio API to watch the mic level.
  function startVAD(stream){
    try {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var src = _audioCtx.createMediaStreamSource(stream);
      var an = _audioCtx.createAnalyser(); an.fftSize = 512;
      src.connect(an);
      var buf = new Uint8Array(an.fftSize);
      var spoke = false, lastLoud = Date.now();
      _vadTimer = setInterval(function(){
        if (!recording) return;
        an.getByteTimeDomainData(buf);
        var s = 0; for (var i = 0; i < buf.length; i++){ var v = (buf[i] - 128) / 128; s += v * v; }
        if (Math.sqrt(s / buf.length) > 0.045){ spoke = true; lastLoud = Date.now(); }
        if (spoke && (Date.now() - lastLoud) > 1400){ stop(); }   // ~1.4s of silence
      }, 100);
      _maxTimer = setTimeout(function(){ if (recording) stop(); }, 30000);  // hard cap
    } catch(e){}
  }
  function stopVAD(){
    if (_vadTimer){ clearInterval(_vadTimer); _vadTimer = null; }
    if (_maxTimer){ clearTimeout(_maxTimer); _maxTimer = null; }
    try { if (_audioCtx) _audioCtx.close(); } catch(e){}
    _audioCtx = null;
  }

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function setStatus(t){ statusEl.textContent = t || ''; }
  function addTurn(role, text){
    var p = document.createElement('p');
    p.className = 'convo-turn convo-' + role;
    p.innerHTML = '<span class="convo-role">' + (role === 'you' ? 'You' : 'Host') + '</span> '
      + esc(text).replace(/\n/g, '<br>');
    logEl.appendChild(p);
    logEl.style.display = 'block';
    logEl.scrollTop = logEl.scrollHeight;
  }
  function cachedApi(){ try { return localStorage.getItem('convoApi'); } catch(e){ return null; } }
  function getApi(){
    if (apiPromise) return apiPromise;
    // Explicit ?api=<url> override wins for this load.
    var q = qp.get('api');
    if (q){ var u0 = q.replace(/\/+$/, ''); try { localStorage.setItem('convoApi', u0); } catch(e){}
            apiPromise = Promise.resolve(u0); return apiPromise; }
    // PRIMARY: the fresh URL published to R2 (CORS-enabled). A cached localStorage
    // value is only a fallback when R2 is unreachable — it must NEVER shadow R2,
    // or a stale (rotated/dead) tunnel URL keeps getting used. That was the
    // "Network error" bug: an old ?api= URL stuck in localStorage.
    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, 6000);
    apiPromise = fetch((window.AUDIO_BASE || '') + 'convo_api.json', {cache:'no-store', signal: ctrl.signal})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ clearTimeout(to);
        var u = (j && j.api) ? j.api.replace(/\/+$/, '') : null;
        if (u){ try { localStorage.setItem('convoApi', u); } catch(e){} return u; }
        return cachedApi();
      })
      .catch(function(){ clearTimeout(to); return cachedApi(); });
    return apiPromise;
  }
  async function start(){
    setStatus('Connecting…');
    var api = await getApi();
    if (!api){ setStatus('Voice Q&A is offline right now. Add ?api=<your tunnel URL> to the page URL.'); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder){ setStatus('Mic not supported in this browser.'); return; }
    var stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ setStatus('Microphone permission denied.'); return; }
    if (!audio.paused){ audio.pause(); box.dataset.resume = '1'; }
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      send(api, new Blob(chunks, {type: (recorder && recorder.mimeType) || 'audio/webm'}));
    };
    recorder.start();
    recording = true;
    btn.textContent = '⏹ Stop & send';
    btn.classList.add('convo-rec');
    setStatus('Listening… I’ll send automatically when you stop talking.');
    startVAD(stream);
  }
  function stop(){
    if (!recording) return;
    recording = false;
    stopVAD();
    btn.textContent = '🎤 Ask about this episode';
    btn.classList.remove('convo-rec');
    setStatus('Thinking…');
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  }
  async function send(api, blob){
    var fd = new FormData();
    fd.append('slug', EPS[idx].slug);
    fd.append('t', String(Math.floor(audio.currentTime || 0)));
    fd.append('audio', blob, 'q.webm');
    try {
      var r = await fetch(api + '/ask', {method:'POST', body: fd});
      var j = await r.json();
      if (!r.ok || j.error){ setStatus('Error: ' + (j.error || r.status)); return; }
      addTurn('you', j.question);
      addTurn('host', j.answer);
      setStatus('');
      if (j.audio_b64){
        answer.src = 'data:' + (j.audio_mime || 'audio/mpeg') + ';base64,' + j.audio_b64;
        answer.onended = function(){ if (box.dataset.resume === '1'){ audio.play().catch(function(){}); box.dataset.resume = ''; } };
        answer.play();
      }
    } catch(e){ setStatus('Network error — is the backend running?'); }
  }
  btn.addEventListener('click', function(){ recording ? stop() : start(); });

  // ---- typed question (text) -> same /ask, but speak=false (no TTS/audio) ----
  async function sendText(){
    var q = textInput.value.trim();
    if (!q) return;
    setStatus('Connecting…');
    var api = await getApi();
    if (!api){ setStatus('Voice Q&A is offline right now. Add ?api=<your tunnel URL> to the page URL.'); return; }
    textInput.value = '';
    addTurn('you', q);
    setStatus('Thinking…');
    var fd = new FormData();
    fd.append('slug', EPS[idx].slug);
    fd.append('t', String(Math.floor(audio.currentTime || 0)));
    fd.append('text', q);
    fd.append('speak', 'false');
    try {
      var r = await fetch(api + '/ask', {method:'POST', body: fd});
      var j = await r.json();
      if (!r.ok || j.error){ setStatus('Error: ' + (j.error || r.status)); return; }
      addTurn('host', j.answer);
      setStatus('');
    } catch(e){ setStatus('Network error — is the backend running?'); }
  }
  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); sendText(); } });

  // Keep the screen awake while an episode is playing. A browser blocks mic
  // access when the page is hidden / the screen is off (a security rule we can't
  // override), so without this the earbud "Ask" can't start recording once the
  // screen sleeps. This stops the auto-off; a manual power-button press still
  // hides the page (then only play/pause/next work, not Ask).
  var _wake = null;
  async function acquireWake(){
    try { if ('wakeLock' in navigator) _wake = await navigator.wakeLock.request('screen'); } catch(e){}
  }
  function releaseWake(){ try { if (_wake){ _wake.release(); _wake = null; } } catch(e){} }
  audio.addEventListener('play', acquireWake);
  audio.addEventListener('pause', releaseWake);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && !audio.paused) acquireWake();
  });

  // ---- Bluetooth earbud / media-key control via the Media Session API ----
  // single-tap = play/pause (default), DOUBLE-tap (nexttrack) = Ask about this
  // episode, triple-tap (previoustrack) = previous episode. Without these
  // handlers the double/triple taps do nothing (that's why they seemed dead).
  if ('mediaSession' in navigator) {
    var ms = navigator.mediaSession;
    var setH = function(action, fn){ try { ms.setActionHandler(action, fn); } catch(e){} };
    setH('play',  function(){ audio.play().catch(function(){}); });
    setH('pause', function(){ audio.pause(); });
    setH('nexttrack',     function(){ recording ? stop() : start(); });   // double-tap -> Ask
    setH('previoustrack', function(){ load(idx - 1, true); });            // triple-tap -> previous ep
    audio.addEventListener('timeupdate', function(){
      if (ms.setPositionState && audio.duration && isFinite(audio.duration)) {
        try { ms.setPositionState({ duration: audio.duration, position: audio.currentTime,
                                    playbackRate: audio.playbackRate || 1 }); } catch(e){}
      }
    });
  }
})();
</script>
